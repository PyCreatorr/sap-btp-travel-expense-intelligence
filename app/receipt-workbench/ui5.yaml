specVersion: "3.0"
metadata:
  name: receipt-workbench
type: application

server:
  customMiddleware:
    - name: ui5-middleware-simpleproxy
      afterMiddleware: compression
      configuration:
        baseUri: "http://localhost:4004"
        mountPath: /odata
resources:
  configuration:
    propertiesFileSourceEncoding: UTF-8
builder:
  resources:
    excludes:
      - "/test/**"
      - "/localService/**"
  customTasks:
    - name: ui5-task-zipper
      afterTask: generateVersionInfo
      configuration:
        archiveName: receipt-workbench
        relativePaths: true
        additionalFiles:
          - xs-app.json
